[[plugins]]
repo = 'Shougo/ddc.vim'
depends = 'denops.vim'
hook_source = "lua require('plugins.ddc')"
on_event = 'InsertEnter'

[[plugins]]
repo = 'Shougo/pum.vim'
on_source = 'ddc.vim'

[[plugins]]
repo = 'Shougo/ddc-ui-pum'
denops = 'pum.vim'
on_source = 'ddc.vim'

[[plugins]]
repo = 'Shougo/ddc-matcher_head'
on_source = 'ddc.vim'

[[plugins]]
repo = 'Shougo/ddc-sorter_rank'
on_source = 'ddc.vim'

[[plugins]]
repo = 'Shougo/ddc-source-around'
on_source = 'ddc.vim'

[[plugins]]
repo = 'Shougo/ddc-source-lsp'
on_source = ['ddc.vim', 'nvim-lspconfig']

[[plugins]]
repo = 'uga-rosa/ddc-source-lsp-setup'
on_source = 'ddc-source-lsp' 

[[plugins]]
repo = 'LumaKernel/ddc-file'
on_source = 'ddc.vim'

[[plugins]]
repo = 'vim-skk/skkeleton'
on_source = 'ddc.vim'
hook_source = "lua require('plugins.skkeleton')"

[[plugins]]
repo = 'delphinus/skkeleton_indicator.nvim'
on_source = ['ddc.vim', 'skkeleton']

[[plugins]]
repo = 'Shougo/ddc-source-cmdline'
on_source = 'ddc.vim'

[[plugins]]
repo = 'Shougo/ddc-source-cmdline-history'
on_source = 'ddc.vim'

